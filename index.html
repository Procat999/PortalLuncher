---
layout: null
title: Nexus Portal - Hybrid Store
permalink: /
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-card: #334155;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #475569;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .w-full { width: 100%; }

        /* --- Version & Sync UI --- */
        .version-tag {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }
        .sync-indicator.pending { background: var(--warning); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- Layout --- */
        header {
            padding: 1rem 2rem;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 50;
        }

        .search-bar {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            border-radius: 99px;
            width: 250px;
            outline: none;
        }
        .search-bar:focus { border-color: var(--accent); }

        .main-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: calc(100vh - 73px);
        }

        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            height: calc(100vh - 73px);
            position: sticky; top: 73px;
        }

        .content-area { padding: 2rem; }

        /* --- Cards --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
            position: relative;
            border: 1px solid transparent;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; }
        .card-body { padding: 1rem; }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 10;
        }

        /* --- Buttons --- */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--border); color: white; }
        .btn-secondary.active { background: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* --- Sidebar UI --- */
        .sidebar-section { margin-bottom: 2rem; }
        .section-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; font-weight: bold; }
        
        .stats-badge {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg-panel); padding: 2rem; border-radius: 16px;
            width: 450px; border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; }

        /* --- Game Player --- */
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; }
        iframe { flex: 1; border: none; }
    </style>
</head>
<body>

<div class="version-tag">
    <div id="syncStatus" class="sync-indicator"></div>
    <span id="versionLabel">v0.1</span>
</div>

<div id="authScreen" class="modal-overlay hidden">
    <div class="modal" style="text-align: center;">
        <h2 style="margin-top:0; color: var(--accent);">NEXUS PORTAL</h2>
        <div class="form-group"><input type="text" id="loginUser" placeholder="Username"></div>
        <div class="form-group"><input type="password" id="loginPass" placeholder="Password"></div>
        <button class="btn btn-primary w-full" onclick="auth('login')">Login</button>
        <button class="btn btn-secondary w-full" style="margin-top:8px" onclick="auth('reg')">Create Account</button>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div class="flex items-center gap-2">
            <span style="font-weight: 900; font-size: 1.4rem; letter-spacing: -1px; margin-right: 1rem;">NEXUS</span>
            <button class="btn btn-secondary nav-btn active" id="btn-home" onclick="nav('home')">Store</button>
            <button class="btn btn-secondary nav-btn" id="btn-lib" onclick="nav('lib')">Library</button>
        </div>

        <input type="text" class="search-bar" id="searchInput" placeholder="Search games..." oninput="renderGames()">

        <div class="flex items-center gap-2">
            <div id="pointsDisplay" style="color: var(--success); font-weight: bold; margin-right: 10px;">100 PTS</div>
            <button class="btn btn-secondary" style="padding: 5px;" onclick="nav('profile')">Profile</button>
            <button class="btn btn-danger" style="padding: 5px;" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <p class="section-label">Dev Panel</p>
                <button class="btn btn-primary w-full" onclick="openUpload()">+ Upload Game</button>
                
                <div class="stats-badge">
                    <span style="font-size: 0.75rem; color: var(--text-dim);">Store Games</span>
                    <span id="gameCount" style="font-weight: bold; font-size: 0.8rem;">0</span>
                </div>

                <div id="syncBox" class="hidden" style="margin-top: 10px; padding: 10px; background: rgba(34, 197, 94, 0.1); border-radius: 8px; border: 1px solid var(--success);">
                    <p style="font-size: 0.7rem; margin: 0 0 8px 0; color: var(--success);">Pending Changes!</p>
                    <button class="btn btn-success w-full text-xs" onclick="exportStore()">Commit & Sync JSON</button>
                </div>
            </div>
            
            <div class="sidebar-section">
                <p class="section-label">System Status</p>
                <div id="serverStatus" class="text-xs" style="color: var(--text-dim); line-height: 1.4;">Checking server...</div>
            </div>
        </aside>

        <main class="content-area">
            <div id="viewTitle"><h2 style="margin-top:0">Browse Store</h2></div>
            <div id="gameGrid" class="game-grid"></div>
        </main>
    </div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" class="modal-overlay hidden">
    <div class="modal">
        <h3 style="margin-top:0">Publish New Game</h3>
        <div class="form-group"><label>Title</label><input type="text" id="upTitle" placeholder="My Awesome Game"></div>
        <div class="form-group"><label>Cost (PTS)</label><input type="number" id="upCost" value="0"></div>
        <div class="form-group"><label>Thumbnail URL</label><input type="text" id="upThumb" placeholder="https://..."></div>
        <div class="form-group">
            <label>Platform</label>
            <select id="upType">
                <option value="web">Browser (Playable)</option>
                <option value="pc">Windows (Download)</option>
                <option value="android">Android (Download)</option>
            </select>
        </div>
        <div class="form-group"><label>Direct Link</label><input type="text" id="upWeb" placeholder="https://..."></div>
        <button class="btn btn-primary w-full" onclick="saveGame()">Publish Locally</button>
        <button class="btn btn-secondary w-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
    </div>
</div>

<!-- Game Player -->
<div id="player" class="player-overlay hidden">
    <div style="padding: 10px; background: #1e293b; display: flex; justify-content: space-between; align-items: center;">
        <span id="nowPlaying" style="font-weight: bold;">Game Title</span>
        <button class="btn btn-danger" style="padding: 5px 15px;" onclick="closePlayer()">Close</button>
    </div>
    <iframe id="gameIframe"></iframe>
</div>

<script>
    let state = {
        users: JSON.parse(localStorage.getItem('np_users')) || [],
        games: JSON.parse(localStorage.getItem('np_games')) || [],
        version: parseFloat(localStorage.getItem('np_ver')) || 0.1,
        user: null,
        currentView: 'home',
        hasPendingChanges: false
    };

    window.onload = async () => {
        updateVersionUI();
        updateGameCount();
        await checkRemote();
        const logged = localStorage.getItem('np_logged');
        if(logged) {
            state.user = state.users.find(u => u.id === logged);
            if(state.user) startApp(); else showAuth();
        } else showAuth();
    };

    // --- Sync & Versioning ---
    async function checkRemote() {
        const status = document.getElementById('serverStatus');
        try {
            const res = await fetch('store.json');
            if(res.ok) {
                const remote = await res.json();
                if(remote.version > state.version) {
                    status.innerHTML = `<span style="color:var(--accent)">Update Found (v${remote.version})</span><br><button class="btn btn-primary text-xs w-full mt-2" onclick="syncWithRemote()">Update Client</button>`;
                } else {
                    status.innerText = "Version is up to date with server.";
                }
            } else status.innerText = "Standalone Local Mode.";
        } catch(e) { status.innerText = "Local Storage Mode."; }
    }

    function syncWithRemote() {
        fetch('store.json').then(r => r.json()).then(data => {
            state.version = data.version;
            state.games = data.games;
            localStorage.setItem('np_ver', state.version);
            save();
            location.reload();
        });
    }

    function exportStore() {
        // Version ONLY increases here
        state.version = parseFloat((state.version + 0.1).toFixed(1));
        state.hasPendingChanges = false;
        localStorage.setItem('np_ver', state.version);
        save();
        
        const blob = new Blob([JSON.stringify({ version: state.version, games: state.games }, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'store.json';
        a.click();
        
        alert("Success! Downloaded store.json. Upload this to your GitHub repository to update the public site.");
        updateVersionUI();
    }

    // --- Core App Functionality ---
    function showAuth() { document.getElementById('authScreen').classList.remove('hidden'); }
    function startApp() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('pointsDisplay').innerText = `${state.user.points} PTS`;
        renderGames();
    }

    function auth(type) {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        if(!u || !p) return alert("Enter credentials");
        if(type === 'reg') {
            const newUser = { id: crypto.randomUUID(), user: u, pass: p, points: 100, library: [] };
            state.users.push(newUser);
            state.user = newUser;
        } else {
            state.user = state.users.find(x => x.user === u && x.pass === p);
        }
        if(state.user) {
            localStorage.setItem('np_logged', state.user.id);
            save(); startApp();
        } else alert("Invalid Login");
    }

    function nav(view) {
        state.currentView = view;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + (view === 'home' ? 'home' : 'lib')).classList.add('active');
        
        const title = document.getElementById('viewTitle');
        if(view === 'home') title.innerHTML = '<h2>Browse Store</h2>';
        else if(view === 'lib') title.innerHTML = '<h2>My Library</h2>';
        else if(view === 'profile') title.innerHTML = '<h2>Developer Profile</h2>';
        
        renderGames();
    }

    function renderGames() {
        const grid = document.getElementById('gameGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';
        
        let filtered = state.games;
        
        // Filter by View
        if(state.currentView === 'lib') {
            filtered = state.games.filter(g => state.user.library.includes(g.id) || g.cost === 0);
        } else if(state.currentView === 'profile') {
            filtered = state.games.filter(g => g.ownerId === state.user.id);
        }

        // Filter by Search
        filtered = filtered.filter(g => g.title.toLowerCase().includes(search));

        filtered.forEach(g => {
            const owned = state.user.library.includes(g.id) || g.cost === 0;
            const isOwner = g.ownerId === state.user.id;
            
            let btnText = "Unlock";
            if(owned) {
                btnText = g.type === 'web' ? "Play Game" : "Download";
            }

            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                ${isOwner ? `<button class="delete-btn" onclick="deleteGame('${g.id}')">Delete</button>` : ''}
                <img class="card-thumb" src="${g.thumb || 'https://via.placeholder.com/300/0f172a/94a3b8?text=Nexus+Portal'}">
                <div class="card-body">
                    <div class="flex justify-between items-center">
                        <strong title="Platform: ${g.type.toUpperCase()}">${g.title}</strong>
                        <span style="font-size:0.75rem; color:var(--success)">${owned ? 'OWNED' : g.cost+' PTS'}</span>
                    </div>
                    <button class="btn btn-primary w-full" style="margin-top:10px" onclick="handleAction('${g.id}')">
                        ${btnText}
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
        updateGameCount();
    }

    function handleAction(id) {
        const g = state.games.find(x => x.id === id);
        const owned = state.user.library.includes(id) || g.cost === 0;

        if(owned) {
            if(g.type === 'web') {
                document.getElementById('nowPlaying').innerText = g.title;
                document.getElementById('gameIframe').src = g.web;
                document.getElementById('player').classList.remove('hidden');
            } else {
                window.open(g.web, '_blank');
            }
        } else {
            if(state.user.points >= g.cost) {
                state.user.points -= g.cost;
                state.user.library.push(id);
                save(); startApp();
            } else alert("Insufficient points!");
        }
    }

    function saveGame() {
        const title = document.getElementById('upTitle').value;
        const link = document.getElementById('upWeb').value;
        if(!title || !link) return alert("Title and Link are required");

        const g = {
            id: crypto.randomUUID(),
            ownerId: state.user.id,
            title: title,
            cost: parseInt(document.getElementById('upCost').value) || 0,
            thumb: document.getElementById('upThumb').value,
            type: document.getElementById('upType').value,
            web: link
        };
        state.games.push(g);
        state.hasPendingChanges = true;
        save();
        closeModal();
        renderGames(); // Refresh UI immediately
        updateVersionUI();
    }

    function deleteGame(id) {
        if(!confirm("Delete this game from your local store?")) return;
        state.games = state.games.filter(g => g.id !== id);
        state.hasPendingChanges = true;
        save();
        renderGames(); // Refresh UI immediately
        updateVersionUI();
    }

    function updateGameCount() {
        document.getElementById('gameCount').innerText = state.games.length;
    }

    function updateVersionUI() {
        document.getElementById('versionLabel').innerText = `v${state.version}`;
        const indicator = document.getElementById('syncStatus');
        const syncBox = document.getElementById('syncBox');
        if(state.hasPendingChanges) {
            indicator.classList.add('pending');
            syncBox.classList.remove('hidden');
        } else {
            indicator.classList.remove('pending');
            syncBox.classList.add('hidden');
        }
    }

    function save() {
        localStorage.setItem('np_users', JSON.stringify(state.users));
        localStorage.setItem('np_games', JSON.stringify(state.games));
    }
    function logout() { localStorage.removeItem('np_logged'); location.reload(); }
    function openUpload() { document.getElementById('uploadModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('uploadModal').classList.add('hidden'); }
    function closePlayer() { document.getElementById('player').classList.add('hidden'); document.getElementById('gameIframe').src = ''; }
</script>

</body>
</html>
